version: "1"

package:
  id: org.deepinenespanol.game2048
  name: "2048"
  version: 0.3.2.0
  kind: app
  description: |
    Classic 2048 puzzle game for Deepin built with Qt6 and DTK6.

command:
  - /opt/apps/org.deepinenespanol.game2048/files/bin/2048

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/2048-deepin_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  mv $PREFIX/share/applications/2048-deepin.desktop $PREFIX/share/applications/org.deepinenespanol.game2048.desktop
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.game2048/files/bin/2048#' \
      $PREFIX/share/applications/org.deepinenespanol.game2048.desktop

sources: []
